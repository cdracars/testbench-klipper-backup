# Bench-only placeholder: provides the top-level [extruder] object for any config that requires one.
# Disable by commenting the include in printer.cfg. Do not use heater or extruder motion commands.
[extruder]
step_pin: mcu:gpio0
dir_pin: mcu:gpio1
enable_pin: !mcu:gpio2
microsteps: 16
rotation_distance: 1
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: mcu:gpio3
max_power: 0.001
sensor_type: temperature_mcu
min_temp: -273.15
max_temp: 1000
control: watermark
min_extrude_temp: 0
max_extrude_only_distance: 1000
