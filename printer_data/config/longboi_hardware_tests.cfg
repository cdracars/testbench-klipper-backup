# Longboi-specific bench checkout macros.
# Macro-only: nothing moves or switches on at startup.
# Include from printer.cfg when this hardware is installed:
#   [include longboi_hardware_tests.cfg]
#
# Safety: inspect the attached hardware before each motor test. These commands
# use AFC's lane interface and perform a small forward/reverse jog.

[gcode_macro LONGBOI_TEST_LANE]
description: Test one Longboi lane stepper and N20 assist motor
gcode:
  {% set lane = params.LANE|default("")|lower %}
  {% if lane not in ["lane7", "lane8", "lane9", "lane10"] %}
    {action_raise_error("Use LONGBOI_TEST_LANE LANE=lane7|lane8|lane9|lane10")}
  {% endif %}
  RESPOND TYPE=command MSG="{lane} test: verify both motors are clear"
  LANE_MOVE LANE={lane} DISTANCE=20 FORCE=1
  G4 P1000
  LANE_MOVE LANE={lane} DISTANCE=-20 FORCE=1
  TEST_ESPOOLER_ASSIST LANE={lane}

[gcode_macro LONGBOI_TEST_MOTORS]
description: Test both motors on all four Longboi AFC lanes
gcode:
  RESPOND TYPE=command MSG="Longboi motor checkout starting"
  LONGBOI_TEST_LANE LANE=lane7
  LONGBOI_TEST_LANE LANE=lane8
  LONGBOI_TEST_LANE LANE=lane9
  LONGBOI_TEST_LANE LANE=lane10
  RESPOND TYPE=command MSG="Longboi motor checkout complete"

[gcode_macro LONGBOI_SHOW_SWITCH_STATUS]
description: Report Longboi AFC hub and Turtle-Neck input states
gcode:
  RESPOND TYPE=command MSG="Longboi switch status: actuate one switch, then review the reports"
  QUERY_BUFFER BUFFER=longboi
  AFC_STATS

[gcode_macro LONGBOI_TEST_SWITCHES]
description: Guided Longboi switch checkout
gcode:
  RESPOND TYPE=command MSG="Longboi switches: test HUB, TN_ADV, and TN_TRL one at a time"
  RESPOND TYPE=command MSG="Run LONGBOI_SHOW_SWITCH_STATUS after each physical switch change"
  QUERY_BUFFER BUFFER=longboi
  AFC_STATS

[gcode_macro LONGBOI_TEST_ALL]
description: Run Longboi motor checkout, then show switch status
gcode:
  LONGBOI_TEST_MOTORS
  LONGBOI_TEST_SWITCHES
